modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      valid_status_codes: []          # defaults to 2xx
      follow_redirects: true
      preferred_ip_protocol: ip4
      headers:
        User-Agent: "ViridianGrids-Monitor/0.1 (+https://example.bg/monitoring)"

  http_post_2xx:
    prober: http
    timeout: 10s
    http:
      method: POST

  tls_connect:
    prober: tcp
    timeout: 10s
    tcp:
      tls: true

  icmp:
    prober: icmp
    timeout: 5s
